<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::content}, 'Редактирование пользователя')}">
<body>
    <div th:fragment="content">
        <div class="mb-4">
            <a href="/admin/users" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-2"></i>Назад к списку
            </a>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <h5 class="mb-4">Пользователь: <span th:text="${user.username}">username</span></h5>
                
                <form th:action="@{/admin/users/{id}(id=${user.id})}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Предпочитаемые жанры</label>
                        <select class="form-select" name="genreIds" multiple size="10">
                            <option th:each="genre : ${allGenres}" 
                                    th:value="${genre.id}" 
                                    th:text="${genre.name}"
                                    th:selected="${user.preferredGenres != null && user.preferredGenres.contains(genre)}">
                                Genre
                            </option>
                        </select>
                        <small class="text-muted">Удерживайте Ctrl (Cmd на Mac) для выбора нескольких жанров</small>
                    </div>
                    <div class="d-flex justify-content-end">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save me-2"></i>Сохранить изменения
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
