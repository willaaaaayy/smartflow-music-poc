<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::content}, 'Редактирование трека')}">
<body>
    <div th:fragment="content">
        <div class="mb-4">
            <a href="/admin/tracks" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-2"></i>Назад к списку
            </a>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <form th:action="${track.id != null ? '/admin/tracks/' + track.id : '/admin/tracks/new'}" 
                      th:method="${track.id != null ? 'POST' : 'POST'}" method="post">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Название трека *</label>
                            <input type="text" class="form-control" name="title" th:value="${track.title}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Исполнитель *</label>
                            <input type="text" class="form-control" name="artist" th:value="${track.artist}" required>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Альбом</label>
                            <input type="text" class="form-control" name="album" th:value="${track.album}">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Длительность (сек) *</label>
                            <input type="number" class="form-control" name="duration" th:value="${track.duration}" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Статус</label>
                            <select class="form-select" name="isAvailable">
                                <option value="true" th:selected="${track.isAvailable}">Доступен</option>
                                <option value="false" th:selected="${!track.isAvailable}">Недоступен</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">URL аудио *</label>
                        <input type="url" class="form-control" name="audioUrl" th:value="${track.audioUrl}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">URL обложки</label>
                        <input type="url" class="form-control" name="coverUrl" th:value="${track.coverUrl}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Жанры</label>
                        <select class="form-select" name="genreIds" multiple size="5">
                            <option th:each="genre : ${allGenres}" 
                                    th:value="${genre.id}" 
                                    th:text="${genre.name}"
                                    th:selected="${track.genres != null && track.genres.contains(genre)}">
                                Genre
                            </option>
                        </select>
                        <small class="text-muted">Удерживайте Ctrl (Cmd на Mac) для выбора нескольких жанров</small>
                    </div>
                    <div class="d-flex justify-content-end">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save me-2"></i>Сохранить
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
