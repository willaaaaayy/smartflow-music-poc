<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::content}, 'Пользователи')}">
<body>
    <div th:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1><i class="bi bi-people me-2"></i>Пользователи</h1>
            <span class="badge bg-primary" th:text="'Всего: ' + ${totalElements}">Всего: 0</span>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Username</th>
                                <th>Email</th>
                                <th>Display Name</th>
                                <th>Избранных треков</th>
                                <th>Жанров</th>
                                <th>Статус</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${users}">
                                <td th:text="${user.id}">1</td>
                                <td th:text="${user.username}">user</td>
                                <td th:text="${user.email}">user@example.com</td>
                                <td th:text="${user.displayName ?: '-'}">-</td>
                                <td>
                                    <span class="badge bg-info" th:text="${user.favoriteTracks?.size() ?: 0}">0</span>
                                </td>
                                <td>
                                    <span class="badge bg-secondary" th:text="${user.preferredGenres?.size() ?: 0}">0</span>
                                </td>
                                <td>
                                    <span class="badge" 
                                          th:classappend="${user.isActive} ? 'bg-success' : 'bg-danger'"
                                          th:text="${user.isActive} ? 'Активен' : 'Неактивен'">Активен</span>
                                </td>
                                <td>
                                    <a th:href="@{/admin/users/{id}(id=${user.id})}" class="btn btn-sm btn-primary">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Пагинация -->
                <nav th:if="${totalPages > 1}">
                    <ul class="pagination justify-content-center">
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/users(page=${currentPage - 1})}">Предыдущая</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                            th:classappend="${i == currentPage} ? 'active'">
                            <a class="page-link" th:href="@{/admin/users(page=${i})}" th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/users(page=${currentPage + 1})}">Следующая</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</body>
</html>
