spring:
  # Настройки приложения
  application:
    name: smartflow-backend

  # Конфигурация базы данных PostgreSQL
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/smartflow_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Настройки пула соединений HikariCP для высокой производительности
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  # Конфигурация JPA/Hibernate
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate # Используем validate для production, можно изменить на update для dev
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false # Отключаем SQL в логах для production
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        jdbc.batch_versioned_data: true

  # Конфигурация Redis для кэширования
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          # Настройки пула соединений для Redis
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 2000ms

  # Настройки Jackson для JSON сериализации
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: false
    default-property-inclusion: non_null

# Настройки сервера
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-stacktrace: on_param
    include-binding-errors: always

# Логирование
logging:
  level:
    root: INFO
    com.smartflow: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

---
# Профиль для разработки
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    hibernate:
      ddl-auto: update # Автоматическое обновление схемы БД в dev режиме
    show-sql: true # Показываем SQL в консоли для отладки

logging:
  level:
    com.smartflow: DEBUG
    org.hibernate.SQL: DEBUG

---
# Профиль для production
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    hibernate:
      ddl-auto: validate # Валидация схемы БД в production
    show-sql: false # Отключаем SQL в логах

logging:
  level:
    root: WARN
    com.smartflow: INFO

