spring:
  # Настройки приложения
  application:
    name: smartflow-backend
  profiles:
    active: dev

  # Конфигурация базы данных PostgreSQL на VPS
  datasource:
    url: jdbc:postgresql://45.155.164.190:5432/smartflow_db?sslmode=require
    username: smartflow_user
    password: 22o7rL5PGWN4
    driver-class-name: org.postgresql.Driver
    hikari:
      # Настройки пула соединений HikariCP для высокой производительности
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  # Конфигурация JPA/Hibernate
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update # Автоматическое обновление схемы БД в dev режиме
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true # Показываем SQL в консоли для отладки в dev режиме
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        jdbc.batch_versioned_data: true

  # Конфигурация Redis для кэширования на VPS
  data:
    redis:
      host: 45.155.164.190
      port: 6379
      password: ВАШ_ПАРОЛЬ_REDIS # TODO: Замените на реальный пароль Redis
      timeout: 2000ms
      ssl:
        enabled: true # Включен SSL для безопасного подключения
      lettuce:
        pool:
          # Настройки пула соединений для Redis
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 2000ms

  # Настройки Spring Boot Actuator для мониторинга
  management:
    endpoints:
      web:
        exposure:
          include: health,info,metrics,prometheus
        base-path: /actuator
    endpoint:
      health:
        show-details: when-authorized
    metrics:
      export:
        prometheus:
          enabled: true

  # Настройки Jackson для JSON сериализации
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: false
    default-property-inclusion: non_null

  # Настройки Thymeleaf
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false # Отключаем кэш для разработки

# Настройки Telegram бота
telegram:
  bot:
    enabled: ${TELEGRAM_BOT_ENABLED:false}
    token: ${TELEGRAM_BOT_TOKEN:}
    webhook-url: ${TELEGRAM_WEBHOOK_URL:}

# Настройки админ-панели
admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:admin}

# Настройки сервера
server:
  port: 8080
  error:
    include-message: always
    include-stacktrace: on_param
    include-binding-errors: always
  ssl:
    enabled: true
    # TODO: Укажите пути к SSL сертификатам для HTTPS
    # key-store: classpath:keystore.p12
    # key-store-password: ваш_пароль
    # key-store-type: PKCS12
    # key-alias: tomcat

# Логирование
logging:
  level:
    root: INFO
    com.smartflow: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/smartflow.log
    max-size: 10MB
    max-history: 30
    total-size-cap: 1GB

---
# Профиль для разработки (активен по умолчанию)
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    hibernate:
      ddl-auto: update # Автоматическое обновление схемы БД в dev режиме
    show-sql: true # Показываем SQL в консоли для отладки

logging:
  level:
    com.smartflow: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.data.redis: DEBUG

---
# Профиль для production
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    hibernate:
      ddl-auto: validate # Валидация схемы БД в production
    show-sql: false # Отключаем SQL в логах

logging:
  level:
    root: WARN
    com.smartflow: INFO

